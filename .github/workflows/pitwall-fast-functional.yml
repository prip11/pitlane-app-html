name: PITWALL fast functional test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pitwall-fast-functional.yml'

permissions:
  contents: write

jobs:
  fast-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare corrected static build and browser driver
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          vendor=Path('vendor'); vendor.mkdir(exist_ok=True)
          url='https://unpkg.com/prop-types@15.8.1/prop-types.min.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 PITWALL-CI'})
          with urllib.request.urlopen(req,timeout=30) as r: data=r.read()
          if len(data)<1000: raise RuntimeError('PropTypes download too small')
          (vendor/'prop-types.min.js').write_bytes(data)
          p=Path('index.html'); s=p.read_text()
          marker='<script src="vendor/recharts.js"></script>'
          prop='<script src="vendor/prop-types.min.js"></script>'
          if prop not in s:
              if marker not in s: raise RuntimeError('Recharts script marker missing')
              s=s.replace(marker,prop+'\n'+marker)
          if '<link rel="icon" href="data:,">' not in s:
              s=s.replace('</head>','<link rel="icon" href="data:,"></head>')
          p.write_text(s)
          print('PropTypes bytes:',len(data))
          print('Corrected index ready')
          PY
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 --no-save
          (which google-chrome || which chromium || which chromium-browser) | tee /tmp/browser-path
          BROWSER=$(cat /tmp/browser-path)
          "$BROWSER" --version | tee /tmp/browser-version

      - name: Run fast PITWALL functional test
        id: e2e
        continue-on-error: true
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pitwall-fast-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/pitwall-fast.js <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=fs.readFileSync('/tmp/browser-path','utf8').trim();
            console.log('BROWSER:',fs.readFileSync('/tmp/browser-version','utf8').trim());
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; const failed=[]; const step=s=>console.log('STEP:',s);
            page.on('pageerror',e=>errors.push('PAGE: '+String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
            page.on('requestfailed',r=>failed.push(r.url()+' :: '+(r.failure()?.errorText||'unknown')));
            const dump=async(label)=>{
              console.log('--- DIAGNOSTIC',label,'---');
              console.log('BODY:',(await page.locator('body').innerText().catch(()=>'' )).slice(0,1200));
              const state=await page.evaluate(()=>({readyState:document.readyState,React:typeof window.React,ReactDOM:typeof window.ReactDOM,PropTypes:typeof window.PropTypes,Recharts:typeof window.Recharts,rootChildren:document.querySelector('#root')?.children.length??-1,boot:document.querySelector('#boot')?.innerText??null,login:!!document.querySelector('.login-bg'),storage:typeof window.storage})).catch(e=>({evaluateError:String(e)}));
              console.log('STATE:',JSON.stringify(state));
              console.log('ERRORS:',JSON.stringify(errors));
              console.log('FAILED_REQUESTS:',JSON.stringify(failed));
            };

            step('login render');
            await page.goto('http://127.0.0.1:8000/index.html?fast=5',{waitUntil:'networkidle',timeout:20000});
            try { await page.waitForSelector('.login-bg',{state:'visible',timeout:10000}); } catch(e){ await dump('LOGIN TIMEOUT'); throw e; }
            await dump('LOGIN OK');

            step('lead');
            await page.getByRole('button',{name:/Lead/}).click();
            await page.getByRole('button',{name:'Enter Lead'}).click();
            await page.getByText(/DEMO · LEAD/).waitFor({timeout:10000});
            if(await page.locator('.car-card').count()<5) throw new Error('Lead cards missing');

            step('simulation');
            await page.locator('.tab').filter({hasText:'settings'}).click();
            await page.getByRole('button',{name:/Start Live Simulation/}).click();
            await page.getByText(/SIMULATION ACTIVE/).waitFor({timeout:10000});
            await page.waitForFunction(()=>{
              let laps=0,cars=0;
              for(let i=0;i<localStorage.length;i++){
                const k=localStorage.key(i);
                if(k&&k.startsWith('pitwall-demo-v1-car-')){try{const c=JSON.parse(localStorage.getItem(k));cars++;laps+=(c.laps||[]).length}catch(e){}}
              }
              return cars>=5&&laps>=5;
            },null,{timeout:12000});
            const before=await page.evaluate(()=>{let laps=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('pitwall-demo-v1-car-')){try{laps+=(JSON.parse(localStorage.getItem(k)).laps||[]).length}catch(e){}}}return laps});
            console.log('laps before reload',before);

            step('reload persistence');
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('.login-bg',{state:'visible',timeout:10000});
            const after=await page.evaluate(()=>{let laps=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('pitwall-demo-v1-car-')){try{laps+=(JSON.parse(localStorage.getItem(k)).laps||[]).length}catch(e){}}}return laps});
            console.log('laps after reload',after);
            if(after<5) throw new Error('Persisted laps missing after reload');

            step('overview');
            await page.getByRole('button',{name:/Overview/}).click();
            await page.getByRole('button',{name:'Enter Overview'}).click();
            await page.getByText(/DEMO · OVERVIEW/).waitFor({timeout:10000});
            if(await page.locator('.car-card').count()<5) throw new Error('Overview cards missing');
            await page.locator('.tab').filter({hasText:'tires'}).click();
            await page.waitForTimeout(300);
            const tireSections=await page.locator('.sec').count();
            const currentSetLabels=await page.getByText('Current Set',{exact:true}).count();
            if(tireSections<5||currentSetLabels<5) throw new Error(`Overview tire status missing sections=${tireSections} currentSet=${currentSetLabels}`);
            await page.getByRole('button',{name:'Exit'}).click();

            step('crew');
            await page.waitForSelector('.login-bg',{state:'visible'});
            await page.getByRole('button',{name:/Crew/}).click();
            await page.getByPlaceholder('e.g. Marco').fill('CI Tester');
            await page.getByRole('button',{name:'Enter Pit'}).click();
            await page.getByText(/DEMO · CREW/).waitFor({timeout:10000});
            const presence=await page.evaluate(()=>Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).some(k=>k&&k.startsWith('pitwall-demo-user-car-v1-')));
            if(!presence) throw new Error('Crew presence not saved');

            if(errors.length) throw new Error(errors.join(' | '));
            if(failed.length) throw new Error('Failed requests: '+failed.join(' | '));
            console.log('PASS: Lead + simulation + persistence + Overview tire status + Crew');
            await browser.close();
          })().catch(e=>{console.error('FAIL:',e);process.exit(1)});
          JS
          set -o pipefail
          node /tmp/pitwall-fast.js 2>&1 | tee /tmp/pitwall-fast.log

      - name: Record result and publish corrected static build
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            if [ '${{ steps.e2e.outcome }}' = 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi
            echo 'PITWALL fast end-to-end browser test.'
            echo 'Outcome: ${{ steps.e2e.outcome }}'
            echo '--- log ---'
            cat /tmp/pitwall-fast.log 2>/dev/null || true
          } > fast-functional-result.txt
          if [ '${{ steps.e2e.outcome }}' = 'success' ]; then
            git add index.html vendor/prop-types.min.js fast-functional-result.txt
            git commit -m 'Publish functionally tested PITWALL static build' || true
          else
            git add fast-functional-result.txt
            git commit -m 'Record PITWALL fast functional result' || true
          fi
          git pull --rebase origin main || true
          git push || true

      - name: Fail if test failed
        if: steps.e2e.outcome != 'success'
        run: exit 1

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>PITWALL DEMO</title></head><body style="margin:0;background:#111214;color:#eeeef4;font-family:Arial,sans-serif"><div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div>PITWALL DEMO loading…<br><small style="color:#8b8d92">Browser app v5</small></div></div><script>(async()=>{const boot=document.getElementById('boot');const show=s=>boot.innerHTML='<div>PITWALL DEMO loading…<br><small style="color:#8b8d92">Browser app v5 · '+s+'</small></div>';const fail=(s,e)=>{boot.innerHTML='<div style="padding:24px;max-width:520px"><b>PITWALL '+s+' error</b><br><br><small>'+String(e)+'</small></div>';console.error(s,e)};try{if(typeof DecompressionStream!=='function')throw new Error('gzip decompression unavailable');const names=['part1.js','part2.js','part3.js','part4.js','part5.js','part6a.js','part6b.js','part6c.js','part7.js','part8.js'];show('loading package');const texts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=5',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return r.text()}));const parts=texts.map((txt,i)=>{const m=txt.match(/push\(("[\s\S]*")\);?\s*$/);if(!m)throw new Error(names[i]+' payload invalid');return JSON.parse(m[1])});show('unpacking');const a=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let t=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();if(!t.includes('PITWALL DEMO — Fast Browser Build'))throw new Error('app signature missing');t=t.replace('<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>','<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>\n<script crossorigin src="https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js"></script>');t=t.replace('<script src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js"></script>','<script src="https://unpkg.com/recharts@2.15.3/umd/Recharts.min.js"></script>');t=t.replace('Fast precompiled build','Browser app v5 · starting PITWALL');show('starting PITWALL');document.open();document.write(t);document.close()}catch(e){fail('loader',e)}})();</script></body></html>

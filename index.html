<script>(async()=>{try{const b=(window.PITWALL_PARTS||[]).join("");const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const t=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById("boot").innerHTML="PITWALL failed to start.<br><br>"+e;console.error(e)}})();</script></body></html>
